# Research interests, shown as tags under the bio on the homepage.
interests:
  - Machine learning
  - Human–AI interaction
  - Recommender systems
  - Game theory

# One line under the interests on the homepage (Markdown allowed). Delete to hide.
contact_note: 'Share these interests? [Email me](mailto:jordan.lee@example.org). Prospective students, please read [this page](prospective-students/) first.'


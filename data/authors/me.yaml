# Your profile. Everything here is placeholder content for a fictional person; replace it with your own.
# Used by the homepage hero, publication author lists ("me" in front matter), the Experience page,
# the footer contact line and the schema.org Person data.
schema: hugoblox/author/v1
slug: me
is_owner: true
name:
  display: Jordan Lee
  given: Jordan
  family: Lee
  alternate: ''       # e.g. a name in another script
  pronunciation: ''
  pronouns: ''
postnominals:
  - PhD
status:
  icon: "☕️"
  # Shown as a small label beside the profile links when text is set. Empty hides it.
